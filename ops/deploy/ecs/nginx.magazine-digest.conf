server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 128m;
    gzip on;
    gzip_min_length 1024;
    gzip_types application/json text/plain text/css application/javascript;

    location = /healthz {
        auth_basic off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location = /magazine-runtime {
        auth_basic off;
        return 302 /magazine-runtime/;
    }

    location /magazine-runtime/ {
        auth_basic off;
        alias /srv/magazine-digest/current/runtime/dist/;
        index index.json;
        autoindex off;
        add_header Cache-Control "no-store";
    }

    location = /magazine-admin {
        return 302 /magazine-admin/;
    }

    location /magazine-admin/ {
        auth_basic "Magazine Digest Admin";
        auth_basic_user_file /etc/nginx/.htpasswd-magazine-digest;

        proxy_pass http://127.0.0.1:4174;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
