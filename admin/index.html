<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stage C Admin Shell</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f3efe6;
        --panel: #fffaf2;
        --ink: #1f2a37;
        --accent: #a24d2f;
        --line: #d7c7b1;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", sans-serif;
        background: radial-gradient(circle at top, #fff8ef 0%, var(--bg) 60%);
        color: var(--ink);
      }

      #app {
        min-height: 100vh;
      }

      .layout {
        display: grid;
        grid-template-columns: 240px 1fr;
        min-height: 100vh;
      }

      .sidebar {
        border-right: 1px solid var(--line);
        padding: 24px;
        background: rgba(255, 250, 242, 0.9);
      }

      .sidebar h1 {
        margin-top: 0;
        font-size: 20px;
      }

      .sidebar a {
        display: block;
        margin: 10px 0;
        color: var(--ink);
        text-decoration: none;
      }

      .content {
        padding: 32px;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 20px;
        box-shadow: 0 12px 30px rgba(31, 42, 55, 0.06);
      }

      .chip {
        display: inline-block;
        margin-right: 8px;
        padding: 4px 10px;
        border-radius: 999px;
        background: #f0e0cf;
        color: var(--accent);
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
